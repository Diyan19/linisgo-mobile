<title>LinisGo Finder — Combined Public, User & Admin Wireframe</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;color:#24313b;background:#e9edef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #526f83;outline-offset:2px}.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;gap:9px}.caption{width:min(390px,100%);display:flex;justify-content:space-between;align-items:center;color:#657580;font-size:12px;gap:10px}.caption strong{color:#263441}.caption button{border:1px solid #c3ccd3;background:#fff;border-radius:9px;padding:5px 9px;font-size:11px}.phone{width:min(390px,100%);height:740px;max-height:calc(100dvh - 80px);min-height:475px;background:#fff;border:2px solid #3d474d;border-radius:32px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 43px #24313b24;position:relative}.statusbar{height:28px;flex:0 0 28px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;background:#f6f7f8;font-size:11px;font-weight:750}.topbar{height:54px;flex:0 0 54px;border-bottom:1px solid #dce2e5;display:flex;align-items:center;justify-content:space-between;padding:0 11px;gap:6px}.lefthead,.righthead{display:flex;align-items:center;gap:6px;min-width:0}.appname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iconbtn{border:0;background:transparent;border-radius:8px;min-width:32px;height:34px;font-size:19px;color:#3a4852;position:relative}.iconbtn:hover{background:#f0f3f5}.tinybadge{position:absolute;right:0;top:0;font-size:9px;min-width:15px;line-height:15px;border-radius:12px;background:#334c5f;color:#fff}.body{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:15px;scrollbar-width:thin}.nav{height:67px;flex:0 0 67px;display:flex;align-items:stretch;justify-content:space-around;border-top:1px solid #dce2e5;background:#fff;padding:5px 4px}.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;border-radius:9px;color:#5d6a75;min-width:0}.nav button.active{background:#e9eef1;color:#20333f;font-weight:800}.nav .ico{font-size:22px;line-height:1}.gesture{height:16px;flex:0 0 16px;background:#f6f7f8;display:flex;align-items:center;justify-content:center}.gesture:before{content:"";display:block;background:#8a959d;border-radius:10px;width:95px;height:4px}h1{font-size:21px;line-height:1.22;margin:0 0 8px}h2{font-size:15px;margin:0 0 9px}p{margin:0 0 9px;line-height:1.43}.muted{font-size:12px;color:#687781}.small{font-size:12px}.tiny{font-size:10.5px;color:#687781}.strong{font-weight:750}.section{margin-bottom:18px}.box,.card{border:1px solid #d3dce2;border-radius:12px;padding:13px;background:#fff}.card{margin:0 0 11px}.soft{background:#f3f6f7}.hero{border:1px solid #d3dce2;background:#f5f7f8;border-radius:13px;padding:18px;margin-bottom:16px}.hero h1{margin-top:8px}.placeholder{border:1px dashed #bfcbd1;background:#f1f4f5;color:#7c8993;border-radius:10px;min-height:94px;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:10px;margin:10px 0}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.avatar{width:39px;height:39px;display:grid;place-items:center;background:#eef2f4;border:1px solid #d8e0e4;border-radius:50%;font-weight:800;flex:0 0 39px}.badge{display:inline-block;border:1px solid #c5cfd5;background:#f0f3f5;border-radius:30px;padding:3px 8px;color:#45545f;font-size:10px;font-weight:750}.badge.warning{background:#faf3df;border-color:#e8d6a4;color:#7a6024}.badge.danger{background:#f8e9e9;border-color:#e7c1c1;color:#853c3c}.badge.good{background:#eaf3ed;border-color:#c8ddcf;color:#34634a}.btn{border:1px solid #b9c5cc;background:#fff;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:700;color:#283b47;min-height:34px}.btn.primary{background:#2b4354;color:#fff;border-color:#2b4354}.btn.danger{color:#a03838;border-color:#d9b5b5}.btn.small{font-size:11px;padding:6px 9px;min-height:28px}.btn.full{display:block;width:100%}.btn.link{border:0;background:transparent;color:#3e5b70;padding:4px 2px}.btngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.btngrid button{text-align:left;min-height:65px}.line{border-top:1px solid #e2e6e9;margin:13px 0}.field{margin-bottom:12px}.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:750}.field input,.field select,.field textarea,.input{display:block;width:100%;border:1px solid #cbd5db;border-radius:9px;padding:10px 11px;background:#fff;color:#283945;font-size:13px;min-height:39px}.field textarea{min-height:83px;resize:vertical}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 11px}.chip{border:1px solid #cbd5da;background:#fff;border-radius:24px;padding:7px 10px;font-size:11px}.chip.active{background:#dfe9ed;border-color:#748b99;font-weight:800}.listitem{padding:10px 0;border-bottom:1px solid #edf0f2}.listitem:last-child{border-bottom:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.stat{border:1px solid #d6dfe4;border-radius:11px;padding:13px;min-height:88px}.stat b{font-size:24px;display:block;margin:6px 0 2px}.stat span{color:#697783;font-size:11px}.map{border:1px solid #cbd6dc;background:repeating-linear-gradient(30deg,#e9f0ec 0,#e9f0ec 18px,#f1f3f0 18px,#f1f3f0 34px);height:225px;border-radius:12px;position:relative;overflow:hidden;margin:11px 0}.map:after{content:"";position:absolute;top:0;left:50%;height:100%;border-left:14px solid #fff9;transform:rotate(24deg);pointer-events:none}.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);background:#fff;border:1px solid #627987;box-shadow:0 2px 6px #2b39442b;border-radius:20px;padding:6px 9px;font-size:11px;font-weight:800}.pin.you{background:#273e4b;color:#fff}.footerhint{font-size:11px;color:#73818a;line-height:1.4;margin-top:9px}.inline{display:flex;gap:7px;align-items:center}.inline input[type=checkbox]{width:16px;height:16px;accent-color:#344d5b}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.split{display:flex;justify-content:space-between;align-items:center;gap:7px}.notice{padding:10px;border-radius:8px;background:#f0f4f6;border:1px solid #d5e0e6;color:#3c5263;font-size:12px;margin-bottom:10px}.danger-notice{background:#fbefef;border-color:#e4caca;color:#8b4f4f}.empty{border:1px dashed #ccd6db;border-radius:10px;text-align:center;padding:22px 14px;color:#73808a;font-size:12px}.modalhost{position:absolute;inset:0;z-index:20;pointer-events:none}.modalhost.open{pointer-events:auto}.scrim{position:absolute;inset:0;background:#15232d87;display:flex;align-items:flex-end}.sheet{background:white;border-radius:18px 18px 0 0;width:100%;max-height:86%;overflow-y:auto;padding:20px 17px 24px;box-shadow:0 -10px 35px #0001}.toast{position:absolute;bottom:86px;left:16px;right:16px;border-radius:11px;color:#fff;background:#263a47;padding:11px 13px;font-size:12px;text-align:center;box-shadow:0 5px 19px #263a473a;z-index:30}.hidden{display:none!important}@media(max-width:430px){.stage{padding:0;gap:0;justify-content:flex-start}.caption{display:none}.phone{border:0;border-radius:0;max-height:none;min-height:0;height:100dvh;width:100%;box-shadow:none}.statusbar{padding-top:env(safe-area-inset-top,0px);height:calc(28px + env(safe-area-inset-top,0px));flex-basis:calc(28px + env(safe-area-inset-top,0px))}.gesture{height:calc(16px + env(safe-area-inset-bottom,0px));flex-basis:calc(16px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div class="stage"><div class="caption"><strong>LINISGO FINDER · COMBINED PROTOTYPE</strong><button id="reset-top">Reset demo data</button></div><div class="phone" id="phone"><div class="statusbar"><span>9:41</span><span>▂▃▅  ▰</span></div><header class="topbar" id="topbar"></header><main class="body" id="screen" tabindex="-1"></main><nav class="nav" id="nav" aria-label="Primary navigation"></nav><div class="gesture"></div><div class="modalhost" id="modalhost"></div><div id="toastarea"></div></div><div class="caption"><span>One HTML file · fictional accounts · saved in this browser</span><span>Not a real authentication system</span></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), STORAGE='linisgo_combined_wireframe_v1', SESSION='linisgo_combined_session_v1';
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Math.random().toString(36).slice(2,9);
const when=()=>new Date().toLocaleString();
const seed=()=>({
 users:[{id:'demo',name:'Juan Dela Cruz',tag:'client',bio:'I can request or offer household cleaning.',contactPhone:'0912-XXX-XXXX',contactFacebook:'Juan (demo)',showPhone:false,showFacebook:true,map:true,x:47,y:48,available:true,state:'active',suspendedUntil:null,suspensionType:null},{id:'ana',name:'Ana Lopez',tag:'client',bio:'Looking for reliable household cleaners.',contactPhone:'',contactFacebook:'Ana (demo)',showPhone:false,showFacebook:true,map:true,x:24,y:33,available:false,state:'active'},{id:'ben',name:'Ben Ramos',tag:'provider',bio:'Professional residential cleaning services.',contactPhone:'0900-XXX-XXXX',contactFacebook:'Ben (demo)',showPhone:true,showFacebook:false,map:true,x:76,y:27,available:true,state:'active'},{id:'mira',name:'Mira Santos',tag:'client',bio:'I occasionally offer home cleaning services.',contactPhone:'',contactFacebook:'Mira (demo)',showPhone:false,showFacebook:true,map:true,x:69,y:76,available:true,state:'active'}],
 posts:[{id:'p1',author:'ana',type:'request',title:'Need a Kitchen Cleaner',desc:'Looking for help with a kitchen and dining area.',category:'Kitchen',amount:700,status:'open',moderated:false,created:'2026-11-08',photo:''},{id:'p2',author:'ben',type:'offer',title:'Deep House Cleaning Available',desc:'I offer detailed house cleaning and bathroom cleaning.',category:'Deep',amount:800,status:'active',moderated:false,created:'2026-11-08',photo:''},{id:'p3',author:'mira',type:'offer',title:'General House Cleaning',desc:'I help families with general home cleaning.',category:'General',amount:500,status:'active',moderated:false,created:'2026-11-07',photo:''},{id:'p4',author:'demo',type:'request',title:'Looking for Bathroom Cleaning',desc:'Need assistance cleaning two bathrooms.',category:'Bathroom',amount:600,status:'open',moderated:false,created:'2026-11-06',photo:''}],
 savedUsers:[],savedPosts:[],reports:[{id:'R001',by:'ana',targetType:'post',targetId:'p2',reason:'Misleading details',status:'Pending',created:when(),decision:''}],appeals:[],notifications:[{id:'n1',to:'demo',title:'Welcome to LinisGo Finder',detail:'Explore posts, save profiles, and create requests or offers.',read:false,created:when()}],logs:[{id:'L001',action:'Demo initialized',detail:'Sample dataset created',created:when()}],counter:1
});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch{}if(!db||!Array.isArray(db.users)||!Array.isArray(db.posts)||!Array.isArray(db.logs))db=seed();
const persist=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{}};
let role='public';try{role=sessionStorage.getItem(SESSION)||'public'}catch{}
const state={page:role==='admin'?'dashboard':role==='user'?'home':'home',stack:[],search:'',userTag:'all',postType:'all',category:'all',sort:'newest',selected:null,filterOpen:false,myTab:'all',savedTab:'users',profileTab:'all',cred:{email:'',password:''},form:{type:'request',title:'',desc:'',category:'General',amount:'',photo:''},editing:null,report:{targetType:'post',targetId:'p1',reason:'Spam',detail:''},appeal:{targetType:'post',targetId:'',detail:''},mapMethod:'manual',modal:null,toast:''};
const u=id=>db.users.find(v=>v.id===id),p=id=>db.posts.find(v=>v.id===id),who=()=>u('demo');
const liveUser=x=>x&&x.state!=='deleted'&&x.state!=='deactivated'&&x.state!=='suspended';
const publicPost=x=>x&&!x.moderated&&!['archived','draft'].includes(x.status)&&liveUser(u(x.author));
const countUnread=()=>db.notifications.filter(n=>n.to===(role==='admin'?'admin':'demo')&&!n.read).length;
const notify=(to,title,detail)=>{db.notifications.unshift({id:newId('n'),to,title,detail,read:false,created:when()});persist()};
const audit=(action,detail)=>{db.logs.unshift({id:newId('L'),action,detail,created:when()});persist()};
const toast=msg=>{state.toast=msg;$('toastarea').innerHTML=`<div class="toast">${ESC(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>{$('toastarea').innerHTML=''},3000)};
function setRole(r){role=r;try{sessionStorage.setItem(SESSION,r)}catch{}state.page=r==='admin'?'dashboard':'home';state.stack=[];state.search='';state.userTag='all';state.postType='all';state.category='all';state.modal=null;render(true)}
function open(page,id){state.stack.push({page:state.page,selected:state.selected});state.page=page;state.selected=id||null;state.modal=null;render(true)}
function back(){const entry=state.stack.pop();if(entry){state.page=entry.page;state.selected=entry.selected}else{state.page=role==='admin'?'dashboard':'home'}render(true)}
function tab(page){state.stack=[];state.page=page;state.modal=null;render(true)}
const mainTabs=()=>role==='public'?[['home','⌂','Home'],['feed','☷','Feed'],['map','⌖','Map'],['search','⌕','Search']]:role==='user'?[['home','⌂','Home'],['feed','☷','Feed'],['map','⌖','Map'],['create','＋','Create'],['profile','♙','Profile']]:[['dashboard','▦','Dashboard'],['users','♙','Users'],['posts','☷','Posts'],['reports','⚑','Reports'],['more','⋯','More']];
const initial=(name)=>ESC(String(name||'?').trim().charAt(0).toUpperCase());
const badge=(text,kind='')=>`<span class="badge ${kind}">${ESC(text)}</span>`;
const flag=(x)=>x==='client'?'Client':'Service Provider';
const snippet=(str,n=90)=>ESC(String(str).length>n?String(str).slice(0,n)+'…':str);
const date=(v)=>ESC(v||'');
const activePosts=()=>db.posts.filter(publicPost);
const visiblePosts=()=>activePosts().filter(x=>(state.postType==='all'||x.type===state.postType)&&(state.category==='all'||x.category===state.category)&&(state.userTag==='all'||u(x.author)?.tag===state.userTag)&&(!state.search||`${x.title} ${x.desc} ${x.category} ${u(x.author)?.name}`.toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>state.sort==='price'?(Number(a.amount||0)-Number(b.amount||0)):String(b.created).localeCompare(String(a.created)));
const visibleUsers=(mapOnly=false)=>db.users.filter(x=>liveUser(x)&&(!mapOnly||x.map)&&(state.userTag==='all'||x.tag===state.userTag)&&(!state.search||`${x.name} ${x.bio}`.toLowerCase().includes(state.search.toLowerCase())||db.posts.some(p=>p.author===x.id&&publicPost(p)&&p.title.toLowerCase().includes(state.search.toLowerCase())))&&(state.postType==='all'&&state.category==='all'||db.posts.some(p=>p.author===x.id&&publicPost(p)&&(state.postType==='all'||p.type===state.postType)&&(state.category==='all'||p.category===state.category))));
const money=x=>x.amount?'₱'+Number(x.amount).toLocaleString():'Negotiable';
function postCard(x,admin=false){const a=u(x.author);return `<article class="card"><button class="btn link" data-action="view-user" data-id="${ESC(x.author)}"><span class="row"><span class="avatar">${initial(a?.name)}</span><span><b>${ESC(a?.name||'Deleted user')}</b><br><span class="tiny">${flag(a?.tag)} tag</span></span></span></button><div class="placeholder">[ Optional post photo ]</div><div class="split">${badge(x.type==='offer'?'OFFERING SERVICES':'LOOKING FOR SERVICES')}<span class="tiny">${date(x.created)}</span></div><h2 style="margin-top:9px">${ESC(x.title)}</h2><p class="small">${snippet(x.desc)}</p><div class="split"><b class="small">${x.type==='request'?'Budget':'Price'}: ${money(x)}</b><button class="btn small" data-action="view-post" data-id="${ESC(x.id)}">Details ›</button></div>${admin?`<div class="actions"><button class="btn small ${x.moderated?'':'danger'}" data-action="admin-toggle-post" data-id="${x.id}">${x.moderated?'Restore':'Hide'} post</button></div>`:role==='user'?`<div class="actions"><button class="btn small" data-action="save-post" data-id="${x.id}">${db.savedPosts.includes(x.id)?'★ Saved':'☆ Save post'}</button><button class="btn small" data-action="report-post" data-id="${x.id}">⚑ Report</button></div>`:''}</article>`}
function filters(){return `<div class="field"><label>Search</label><input class="input" id="searchbar" placeholder="Search users, services, needs..." data-input="search" value="${ESC(state.search)}"></div><div class="field"><label>User status tag</label><div class="chips">${[['all','Show All'],['client','Clients Only'],['provider','Providers Only']].map(([k,v])=>`<button class="chip ${state.userTag===k?'active':''}" data-set="userTag" data-value="${k}">${v}</button>`).join('')}</div></div><div class="field"><label>Post type</label><div class="chips">${[['all','All Posts'],['request','Requests'],['offer','Offers']].map(([k,v])=>`<button class="chip ${state.postType===k?'active':''}" data-set="postType" data-value="${k}">${v}</button>`).join('')}</div></div><div class="split"><button class="btn small" data-action="toggle-filters">⚙ ${state.filterOpen?'Hide':'More'} filters</button><button class="btn small" data-action="clear-filters">Clear filters</button></div>${state.filterOpen?`<div class="box soft" style="margin:10px 0"><div class="field"><label>Category</label><select data-set="category">${['all','General','Deep','Kitchen','Bathroom','Laundry','Other'].map(k=>`<option value="${k}" ${state.category===k?'selected':''}>${k==='all'?'All categories':k+' cleaning'}</option>`).join('')}</select></div><div class="field"><label>Sort posts</label><select data-set="sort"><option value="newest" ${state.sort==='newest'?'selected':''}>Newest</option><option value="price" ${state.sort==='price'?'selected':''}>Price / Budget (low first)</option></select></div><div class="footerhint">Availability filter will be refined later. Status tag and post type are independent.</div></div>`:''}`}
function pageHome(){if(role==='public')return `<section class="hero"><div class="placeholder">[ LinisGo Finder Logo / Hero ]</div><h1>Find cleaning help near you</h1><p class="small">Discover household cleaning service offers and requests in your community.</p><button class="btn primary full" data-tab="feed">Explore the community</button><button class="btn full" style="margin-top:8px" data-tab="map">Explore nearby users</button></section><section class="section"><h2>Cleaning categories</h2><div class="btngrid">${['General','Deep','Kitchen','Bathroom'].map(c=>`<button class="btn" data-action="category-home" data-id="${c}">${c} cleaning ›</button>`).join('')}</div></section><section class="section"><h2>Latest posts</h2>${activePosts().slice(0,2).map(x=>postCard(x)).join('')}</section><button class="btn full" data-action="go-register">Create a free demo account ›</button>`;
const me=who();return `<section class="hero"><div class="muted">Welcome back,</div><h1>${ESC(me?.name||'User')}!</h1>${badge(flag(me?.tag))}<p class="small" style="margin-top:11px">One account lets you request and offer services — regardless of your tag.</p></section><section class="section"><h2>Quick actions</h2><div class="btngrid"><button class="btn" data-tab="create">＋ Create Post</button><button class="btn" data-tab="feed">☷ Browse Feed</button><button class="btn" data-tab="map">⌖ Nearby Users</button><button class="btn" data-nav="saved">☆ My Saved</button><button class="btn" data-nav="my-posts">☷ My Posts</button><button class="btn" data-nav="notifications">♧ Notifications</button></div></section><section class="section"><h2>My activity</h2><div class="stats"><div class="stat"><span>My posts</span><b>${db.posts.filter(x=>x.author==='demo'&&x.status!=='archived').length}</b></div><div class="stat"><span>Saved items</span><b>${db.savedPosts.length+db.savedUsers.length}</b></div><div class="stat"><span>Unread notices</span><b>${countUnread()}</b></div><div class="stat"><span>My reports</span><b>${db.reports.filter(r=>r.by==='demo').length}</b></div></div></section><h2>Recent public posts</h2>${activePosts().slice(0,2).map(x=>postCard(x)).join('')}`}
function pageFeed(){return `<h1>Community Feed</h1><p class="muted">Service requests and offers from public profiles.</p>${filters()}<div class="split section"><b>${visiblePosts().length} matching posts</b><button class="btn small" data-tab="map">Map view ›</button></div>${visiblePosts().map(x=>postCard(x)).join('')||'<div class="empty">No matching posts. Try clearing your filters.</div>'}`}
function userCard(x){return `<div class="card"><div class="row"><div class="avatar">${initial(x.name)}</div><div class="grow"><b>${ESC(x.name)}</b><div class="tiny">${flag(x.tag)} · ${x.available?'Available':'Unavailable'}</div></div><button class="btn small" data-action="view-user" data-id="${x.id}">Profile ›</button></div>${role==='user'?`<div class="actions"><button class="btn small" data-action="save-user" data-id="${x.id}">${db.savedUsers.includes(x.id)?'★ Saved':'☆ Save user'}</button></div>`:''}</div>`}
function pageMap(){const list=visibleUsers(true);return `<h1>Nearby Users Map</h1><p class="muted">Only users who opted into approximate public map visibility.</p>${filters()}<div class="map"><button class="pin you" style="top:52%;left:50%" aria-label="Demo center position">YOU</button>${list.map(x=>`<button class="pin" data-action="view-user" data-id="${x.id}" style="top:${x.y||50}%;left:${x.x||50}%">${x.tag==='client'?'C':'P'} · ${ESC(x.name.split(' ')[0])}</button>`).join('')}</div><div class="footerhint">Conceptual map: no precise user locations, real GPS, or live tracking.</div><div class="split section"><b>Map-visible users</b><span class="tiny">${list.length} results</span></div>${list.map(userCard).join('')||'<div class="empty">No matching map-visible users.</div>'}`}
function pageSearch(){return `<h1>Search & Discover</h1><p class="muted">Search names, cleaning services, and household needs.</p>${filters()}<h2>Matching posts (${visiblePosts().length})</h2>${visiblePosts().map(x=>`<button class="btn full" style="text-align:left;margin-bottom:7px" data-action="view-post" data-id="${x.id}"><span class="tiny">${x.type.toUpperCase()} · ${ESC(x.category)}</span><br>${ESC(x.title)}<br><span class="tiny">By ${ESC(u(x.author)?.name)}</span></button>`).join('')||'<div class="empty">No matching posts.</div>'}<h2 style="margin-top:17px">Matching users (${visibleUsers().length})</h2>${visibleUsers().map(userCard).join('')||'<div class="empty">No matching users.</div>'}`}
function pagePostDetail(){const x=p(state.selected);if(!x)return '<div class="empty">Post not found.</div>';const a=u(x.author);if(role!=='admin'&&!publicPost(x)&&x.author!=='demo')return '<div class="empty">This post is not publicly available.</div>';return `<div class="placeholder" style="height:148px">[ Post photo / gallery ]</div><div class="split">${badge(x.type==='offer'?'Service Offer':'Service Request')}<span class="tiny">${date(x.created)}</span></div><h1 style="margin-top:12px">${ESC(x.title)}</h1><button class="btn full" style="text-align:left" data-action="view-user" data-id="${ESC(x.author)}"><span class="row"><span class="avatar">${initial(a?.name)}</span><span class="grow"><b>${ESC(a?.name||'User')}</b><br><span class="tiny">${flag(a?.tag)} · View public profile</span></span><span>›</span></span></button><div class="line"></div><h2>Cleaning details</h2><p>${ESC(x.desc)}</p><div class="listitem small"><b>Category:</b> ${ESC(x.category)} cleaning</div><div class="listitem small"><b>${x.type==='request'?'Budget':'Price'}:</b> ${money(x)}</div><div class="listitem small"><b>Post status:</b> ${ESC(x.status)}</div>${x.moderated?'<div class="notice danger-notice">Hidden by administration</div>':''}<div class="actions"><button class="btn" data-action="view-user" data-id="${ESC(x.author)}">View author</button>${role==='user'?`<button class="btn" data-action="save-post" data-id="${x.id}">${db.savedPosts.includes(x.id)?'★ Saved':'☆ Save'}</button><button class="btn" data-action="report-post" data-id="${x.id}">Report</button>`:''}${role==='admin'?`<button class="btn danger" data-action="admin-toggle-post" data-id="${x.id}">${x.moderated?'Restore':'Hide'}</button>`:''}</div>`}
function pagePublicProfile(){const x=u(state.selected);if(!x)return '<div class="empty">User not found.</div>';if(role!=='admin'&&!liveUser(x)&&x.id!=='demo')return '<div class="empty">This profile is unavailable.</div>';const entries=db.posts.filter(p=>p.author===x.id&&(role==='admin'||publicPost(p)));return `<div class="row section"><div class="avatar" style="width:66px;height:66px;flex-basis:66px;font-size:24px">${initial(x.name)}</div><div class="grow"><h1>${ESC(x.name)}</h1>${badge(flag(x.tag))}</div></div><div class="box section"><h2>About</h2><p class="small">${ESC(x.bio||'No public bio.')}</p>${x.available?badge('Available','good'):badge('Unavailable')}<div class="line"></div><h2>Public contact information</h2>${x.showPhone&&x.contactPhone?`<div class="listitem small">☎ ${ESC(x.contactPhone)}</div>`:''}${x.showFacebook&&x.contactFacebook?`<div class="listitem small">ⓕ ${ESC(x.contactFacebook)}</div>`:''}${!((x.showPhone&&x.contactPhone)||(x.showFacebook&&x.contactFacebook))?'<div class="muted">No public contact details.</div>':''}</div>${role==='user'&&x.id!=='demo'?`<button class="btn full" data-action="save-user" data-id="${x.id}">${db.savedUsers.includes(x.id)?'★ Remove Saved User':'☆ Save User'}</button>`:''}${role==='user'&&x.id!=='demo'?`<button class="btn full" style="margin-top:7px" data-action="report-user" data-id="${x.id}">⚑ Report User</button>`:''}<h2 style="margin-top:18px">Published services & needs (${entries.length})</h2>${entries.map(x=>postCard(x)).join('')||'<div class="empty">No published posts.</div>'}`}
function pageLogin(){return `<div class="placeholder" style="height:85px">[ LinisGo Finder Logo ]</div><h1>Sign in to LinisGo Finder</h1><p class="muted">Choose a fictional account to explore the User or Admin side.</p><div class="notice"><b>DEMO USER</b><br>user@linisgo.demo<br>Password: <b>User123!</b><div style="height:6px"></div><b>DEMO ADMIN</b><br>admin@linisgo.demo<br>Password: <b>Admin123!</b></div><div class="btngrid section"><button class="btn" data-action="fill-user">Fill User Login</button><button class="btn" data-action="fill-admin">Fill Admin Login</button></div><div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="off" data-input="email" value="${ESC(state.cred.email)}" placeholder="Email address"></div><div class="field"><label>Password</label><input id="login-password" type="password" data-input="password" autocomplete="off" value="${ESC(state.cred.password)}" placeholder="Password"></div><button class="btn primary full" data-action="login">Sign In</button><div class="actions"><button class="btn link" data-nav="register">Register (preview)</button><button class="btn link" data-nav="forgot">Forgot password?</button></div><div class="line"></div><button class="btn full" data-action="guest">Continue as Guest</button><p class="footerhint">Demo passwords are intentionally visible and are not secure credentials. Never reuse them for a real app.</p>`}
function pageRegister(){return `<h1>Create Account</h1><div class="notice">Registration preview only. For this combined prototype, use the sample User account to try all user features.</div><div class="field"><label>Display name</label><input placeholder="Your name" disabled></div><div class="field"><label>Email</label><input placeholder="Email address" disabled></div><div class="field"><label>Password</label><input placeholder="Password" disabled></div><button class="btn full" data-nav="login">Go to demo login</button>`}
function pageForgot(){return `<h1>Reset Password</h1><p class="muted">In the real app, Firebase Auth will handle password reset. This offline prototype never sends email.</p><div class="field"><label>Email</label><input type="email" placeholder="Enter your email" disabled></div><button class="btn full" data-nav="login">Return to login</button>`}
const postForm=()=>{const f=state.form;return `<h1>${state.editing?'Edit Post':'Create Post'}</h1><p class="muted">Anyone signed in as a regular user can request or offer services.</p><div class="field"><label>Post Type</label><div class="chips"><button class="chip ${f.type==='request'?'active':''}" data-form-type="request">Looking for Services</button><button class="chip ${f.type==='offer'?'active':''}" data-form-type="offer">Offering Services</button></div></div><div class="field"><label>Title *</label><input data-form="title" value="${ESC(f.title)}" placeholder="Enter title"></div><div class="field"><label>Cleaning category *</label><select data-form="category">${['General','Deep','Kitchen','Bathroom','Laundry','Other'].map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c} cleaning</option>`).join('')}</select></div><div class="field"><label>Description *</label><textarea data-form="desc" placeholder="Describe the cleaning service or need...">${ESC(f.desc)}</textarea></div><div class="field"><label>${f.type==='request'?'Budget':'Price'} (optional)</label><input data-form="amount" type="number" min="0" value="${ESC(f.amount)}" placeholder="PHP amount"></div><div class="field"><label>Photos (optional)</label><input type="file" accept="image/*" id="photo-input"><span class="tiny">${ESC(f.photo||'No demo photo selected')} · File name only; no upload</span></div><div class="actions"><button class="btn primary" data-action="publish">${state.editing?'Save Changes':'Publish Instantly'}</button>${!state.editing?'<button class="btn" data-action="save-draft">Save Draft</button>':''}<button class="btn" data-action="cancel-create">Cancel</button></div><p class="footerhint">This demo stores text-only posts locally. Photos and external hosting will be integrated during real development.</p>`};
function pageMyPosts(){let my=db.posts.filter(x=>x.author==='demo').filter(x=>state.myTab==='all'||x.type===state.myTab);return `<h1>My Posts</h1><div class="chips">${[['all','All'],['request','Requests'],['offer','Offers']].map(([k,v])=>`<button class="chip ${state.myTab===k?'active':''}" data-set="myTab" data-value="${k}">${v}</button>`).join('')}</div><button class="btn primary full section" data-tab="create">＋ Create New Post</button>${my.map(x=>`<article class="card"><div class="split">${badge(x.type==='request'?'Request':'Offer')} ${badge(x.moderated?'Admin hidden':x.status,x.moderated?'danger':'')}</div><h2 style="margin-top:9px">${ESC(x.title)}</h2><p class="muted">${ESC(x.category)} · ${money(x)}</p><div class="actions"><button class="btn small" data-action="edit-post" data-id="${x.id}">Edit</button><button class="btn small" data-action="change-post-status" data-id="${x.id}">${x.status==='archived'?'Restore':x.status==='open'?'Close':x.status==='closed'?'Reopen':'Archive'}</button>${x.status!=='archived'?`<button class="btn small" data-action="archive-post" data-id="${x.id}">Archive</button>`:''}${x.moderated?`<button class="btn small" data-action="appeal-post" data-id="${x.id}">Appeal</button>`:''}</div></article>`).join('')||'<div class="empty">You have not created any posts yet.</div>'}`}
function pageSaved(){let userMode=state.savedTab==='users';let list=userMode?db.savedUsers:db.savedPosts;return `<h1>My Saved</h1><div class="chips"><button class="chip ${userMode?'active':''}" data-set="savedTab" data-value="users">Saved Users (${db.savedUsers.length})</button><button class="chip ${!userMode?'active':''}" data-set="savedTab" data-value="posts">Saved Posts (${db.savedPosts.length})</button></div>${userMode?list.map(id=>u(id)).filter(liveUser).map(userCard).join(''):list.map(id=>p(id)).filter(publicPost).map(postCard).join('')}${!list.length?'<div class="empty">Nothing saved yet. Try bookmarking a post or public profile.</div>':''}`}
function pageNotifications(){let list=db.notifications.filter(n=>n.to===(role==='admin'?'admin':'demo'));return `<div class="split"><h1>${role==='admin'?'Admin ':''}Notifications</h1><button class="btn small" data-action="read-all">Mark all read</button></div><p class="muted">${list.filter(n=>!n.read).length} unread · Most recent first</p>${list.map(n=>`<div class="card ${n.read?'':'soft'}"><div class="split"><b class="small">${ESC(n.title)}</b>${!n.read?badge('New'):''}</div><p class="small" style="margin-top:8px">${ESC(n.detail)}</p><div class="split"><span class="tiny">${date(n.created)}</span><button class="btn small" data-action="toggle-notif" data-id="${n.id}">${n.read?'Mark unread':'Mark read'}</button></div></div>`).join('')||'<div class="empty">No notifications.</div>'}`}
function pageMyReports(){const list=db.reports.filter(r=>r.by==='demo');return `<h1>My Reports</h1><p class="muted">Private reports submitted by your demo account.</p>${list.map(x=>`<div class="card"><div class="split"><b>${ESC(x.id)}</b>${badge(x.status)}</div><p class="small" style="margin:9px 0">${ESC(x.reason)} · ${ESC(x.targetType)}</p><span class="tiny">${date(x.created)}</span></div>`).join('')||'<div class="empty">You have not submitted any reports.</div>'}`}
function pageMyAppeals(){const list=db.appeals.filter(x=>x.by==='demo');return `<h1>My Appeals</h1><p class="muted">Request review of an administrator action. Appeals never reverse moderation automatically.</p>${list.map(x=>`<div class="card"><div class="split"><b>${ESC(x.id)}</b>${badge(x.status)}</div><p class="small" style="margin-top:9px">${ESC(x.detail)}</p><span class="tiny">${ESC(x.targetType)} · ${ESC(x.targetId)}</span></div>`).join('')||'<div class="empty">No appeals submitted.</div>'}${who()?.state==='suspended'?'<div class="notice">You are suspended. This limited-access appeal page remains available.</div>':''}`}
function pageProfile(){const me=who();return `<div class="row section"><div class="avatar" style="height:66px;width:66px;flex-basis:66px;font-size:25px">${initial(me.name)}</div><div class="grow"><h1 style="margin-bottom:3px">${ESC(me.name)}</h1>${badge(flag(me.tag))}</div></div><div class="box section"><h2>About me</h2><p class="small">${ESC(me.bio)}</p><div class="split"><span class="muted">Service availability</span>${me.available?badge('Available','good'):badge('Unavailable')}</div><div class="line"></div><div class="split"><span class="muted">Profile status tag</span><button class="btn small" data-action="toggle-tag">Change to ${me.tag==='client'?'Provider':'Client'}</button></div><p class="footerhint">Tag is descriptive only. All regular user features stay available.</p></div><div class="btngrid section"><button class="btn" data-nav="edit-profile">✎ Edit Profile</button><button class="btn" data-nav="my-posts">☷ My Posts</button><button class="btn" data-nav="saved">☆ Saved</button><button class="btn" data-nav="notifications">♧ Notifications</button><button class="btn" data-nav="my-reports">⚑ My Reports</button><button class="btn" data-nav="my-appeals">⚖ My Appeals</button><button class="btn" data-nav="settings">⚙ Settings</button><button class="btn" data-action="logout">⇥ Log Out</button></div>`}
function pageEditProfile(){const x=who();return `<h1>Edit My Profile</h1><div class="field"><label>Display Name</label><input data-profile="name" value="${ESC(x.name)}"></div><div class="field"><label>Bio</label><textarea data-profile="bio">${ESC(x.bio)}</textarea></div><div class="field"><label>Public contact number</label><input data-profile="contactPhone" value="${ESC(x.contactPhone)}"></div><div class="field"><label>Facebook / Messenger label</label><input data-profile="contactFacebook" value="${ESC(x.contactFacebook)}"></div><div class="field"><label>Availability</label><select data-profile="available"><option value="true" ${x.available?'selected':''}>Available</option><option value="false" ${!x.available?'selected':''}>Unavailable</option></select></div><button class="btn primary full" data-action="save-profile">Save Profile</button><p class="footerhint">Public visibility of contacts is controlled separately in Settings.</p>`}
function pageSettings(){const x=who();return `<h1>Account Settings</h1><h2>Privacy & contact visibility</h2><div class="box section"><label class="inline listitem"><input type="checkbox" data-setting="showPhone" ${x.showPhone?'checked':''}><span>Show my contact number publicly</span></label><label class="inline listitem"><input type="checkbox" data-setting="showFacebook" ${x.showFacebook?'checked':''}><span>Show my Facebook/Messenger publicly</span></label><label class="inline listitem"><input type="checkbox" data-setting="map" ${x.map?'checked':''}><span>Display my approximate map marker</span></label></div><h2>Map location</h2><div class="box section"><div class="chips"><button class="chip ${state.mapMethod==='manual'?'active':''}" data-set="mapMethod" data-value="manual">Manual map pin</button><button class="chip ${state.mapMethod==='gps'?'active':''}" data-set="mapMethod" data-value="gps">GPS assisted (demo)</button></div><p class="muted">${state.mapMethod==='gps'?'In this offline demo, GPS is simulated without requesting real coordinates.':'Tap inside the map below to reposition an approximate fictional marker.'}</p><div class="map" id="map-edit" data-map-edit="true"><span class="pin you" style="top:${x.y}%;left:${x.x}%">YOUR PIN</span></div></div><h2>Security and account</h2><div class="box"><button class="btn full" data-action="demo-password">Change password (preview)</button><button class="btn full" style="margin-top:8px" data-action="deactivate">Temporarily deactivate</button><button class="btn danger full" style="margin-top:8px" data-action="delete-account">Delete demo account (simulation)</button><button class="btn full" style="margin-top:8px" data-action="logout">Log out</button></div>`}
function pageLocked(){const x=who();return `<h1>${x.state==='deactivated'?'Account Deactivated':'Account Suspended'}</h1><div class="notice ${x.state==='suspended'?'danger-notice':''}">${x.state==='deactivated'?'Your profile, posts and map marker are temporarily hidden. You can reactivate your account.':'An administrator has suspended your account. Normal user features are unavailable. You may submit and track an appeal.'}</div>${x.state==='deactivated'?'<button class="btn primary full" data-action="reactivate">Reactivate Account</button>':`<button class="btn primary full" data-action="appeal-suspension">Submit Suspension Appeal</button><button class="btn full" style="margin-top:9px" data-nav="my-appeals">Track Appeals</button>`}<button class="btn full" style="margin-top:9px" data-action="logout">Log out</button>`}
function pageReportForm(){const f=state.report;return `<h1>Submit Report</h1><p class="muted">Report a suspicious user or misleading cleaning post. The administrator reviews reports after submission.</p><div class="notice">Report target: ${ESC(f.targetType)} · ${ESC(f.targetId)}</div><div class="field"><label>Reason</label><select data-report="reason">${['Spam','Misleading details','Suspicious activity','Inappropriate content','Privacy violation','Other'].map(v=>`<option ${f.reason===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Explanation (required)</label><textarea data-report="detail" placeholder="Explain the issue...">${ESC(f.detail)}</textarea></div><button class="btn primary full" data-action="submit-report">Submit Report</button>`}
function pageAppealForm(){const f=state.appeal;return `<h1>Submit Appeal</h1><p class="muted">Ask an administrator to reconsider a moderation action.</p><div class="notice">Appeal target: ${ESC(f.targetType)} · ${ESC(f.targetId)}</div><div class="field"><label>Your explanation (required)</label><textarea data-appeal="detail" placeholder="Why should the decision be reviewed?">${ESC(f.detail)}</textarea></div><button class="btn primary full" data-action="submit-appeal">Submit Appeal</button>`}
function pageDashboard(){return `<h1>Administrator Dashboard</h1><p class="muted">Basic statistics and recent activities. No advanced analytics.</p><div class="stats"><div class="stat"><span>Registered Users</span><b>${db.users.filter(x=>x.state!=='deleted').length}</b></div><div class="stat"><span>Published Posts</span><b>${activePosts().length}</b></div><div class="stat"><span>Pending Reports</span><b>${db.reports.filter(x=>x.status==='Pending'||x.status==='Under Review').length}</b></div><div class="stat"><span>Pending Appeals</span><b>${db.appeals.filter(x=>x.status==='Pending').length}</b></div><div class="stat"><span>Suspended Users</span><b>${db.users.filter(x=>x.state==='suspended').length}</b></div><div class="stat"><span>Map-Visible Profiles</span><b>${db.users.filter(x=>liveUser(x)&&x.map).length}</b></div></div><h2>Quick management</h2><div class="btngrid section"><button class="btn" data-tab="users">♙ Manage Users</button><button class="btn" data-tab="posts">☷ Manage Posts</button><button class="btn" data-tab="reports">⚑ Review Reports</button><button class="btn" data-nav="appeals-admin">⚖ Review Appeals</button></div><h2>Recent activities</h2><div class="box">${db.logs.slice(0,6).map(x=>`<div class="listitem"><b class="small">${ESC(x.action)}</b><p class="tiny" style="margin-top:4px">${ESC(x.detail)}</p><div class="tiny">${date(x.created)}</div></div>`).join('')}</div>`}
function pageAdminUsers(){return `<h1>User Management</h1><p class="muted">Profiles and account restrictions.</p><div class="field"><label>Find user</label><input class="input" data-input="search" id="searchbar" placeholder="Name or tag" value="${ESC(state.search)}"></div>${db.users.filter(x=>x.state!=='deleted'&&(!state.search||`${x.name} ${x.tag} ${x.state}`.toLowerCase().includes(state.search.toLowerCase()))).map(x=>`<div class="card"><div class="row"><div class="avatar">${initial(x.name)}</div><div class="grow"><b>${ESC(x.name)}</b><div class="tiny">${flag(x.tag)} · ${ESC(x.state)}</div></div><button class="btn small" data-action="admin-user" data-id="${x.id}">Manage ›</button></div></div>`).join('')}`}
function pageAdminUserDetail(){const x=u(state.selected);if(!x)return '<div class="empty">No account found.</div>';const all=db.posts.filter(p=>p.author===x.id);return `<div class="row section"><div class="avatar" style="width:60px;height:60px;flex-basis:60px">${initial(x.name)}</div><div class="grow"><h1>${ESC(x.name)}</h1>${badge(x.state,x.state==='suspended'?'danger':'')}</div></div><div class="box section"><div class="listitem small"><b>Status tag:</b> ${flag(x.tag)}</div><div class="listitem small"><b>Public map visible:</b> ${x.map?'Yes':'No'}</div><div class="listitem small"><b>Number of posts:</b> ${all.length}</div><div class="listitem small"><b>Account:</b> ${ESC(x.state)}</div>${x.suspensionType?`<div class="listitem small"><b>Suspension:</b> ${ESC(x.suspensionType)} ${x.suspendedUntil?'until '+date(x.suspendedUntil):''}</div>`:''}</div><h2>Account actions</h2><div class="actions section"><button class="btn" data-action="moderate-user" data-id="${x.id}" data-kind="warn">Issue Warning</button>${x.state==='suspended'?`<button class="btn primary" data-action="moderate-user" data-id="${x.id}" data-kind="lift">Lift Suspension</button>`:`<button class="btn danger" data-action="moderate-user" data-id="${x.id}" data-kind="suspend">Suspend Account</button>`}</div><h2>Published and private post history</h2>${all.map(x=>`<div class="card"><b class="small">${ESC(x.title)}</b><div class="tiny">${ESC(x.type)} · ${ESC(x.status)} ${x.moderated?'· hidden by admin':''}</div><div class="actions"><button class="btn small" data-action="admin-post" data-id="${x.id}">Review ›</button></div></div>`).join('')||'<div class="empty">No posts.</div>'}`}
function pageAdminPosts(){return `<h1>Post Management</h1><p class="muted">Monitor all requests and offers, including hidden and archived posts.</p><div class="field"><label>Search posts</label><input id="searchbar" data-input="search" class="input" value="${ESC(state.search)}" placeholder="Title or author"></div><div class="chips">${[['all','All'],['request','Requests'],['offer','Offers']].map(([k,v])=>`<button class="chip ${state.postType===k?'active':''}" data-set="postType" data-value="${k}">${v}</button>`).join('')}</div>${db.posts.filter(x=>(state.postType==='all'||x.type===state.postType)&&(!state.search||`${x.title} ${u(x.author)?.name}`.toLowerCase().includes(state.search.toLowerCase()))).map(x=>`<div class="card"><div class="split">${badge(x.type==='request'?'Request':'Offer')} ${badge(x.moderated?'Hidden':x.status,x.moderated?'danger':'')}</div><h2 style="margin-top:9px">${ESC(x.title)}</h2><div class="tiny">By ${ESC(u(x.author)?.name||'User')} · ${ESC(x.category)}</div><div class="actions"><button class="btn small" data-action="admin-post" data-id="${x.id}">Review ›</button><button class="btn small ${x.moderated?'':'danger'}" data-action="admin-toggle-post" data-id="${x.id}">${x.moderated?'Restore':'Hide'}</button></div></div>`).join('')}`}
function pageAdminPostDetail(){const x=p(state.selected);if(!x)return '<div class="empty">Post not found.</div>';return `<h1>Review Post</h1>${badge(x.moderated?'Admin Hidden':x.status,x.moderated?'danger':'')}<div class="placeholder">[ Optional Post Photo ]</div><h2>${ESC(x.title)}</h2><p>${ESC(x.desc)}</p><div class="box section"><div class="listitem small">Posted by: ${ESC(u(x.author)?.name||'User')}</div><div class="listitem small">Type: ${ESC(x.type)}</div><div class="listitem small">Category: ${ESC(x.category)}</div><div class="listitem small">Price / Budget: ${money(x)}</div></div><button class="btn ${x.moderated?'primary':'danger'} full" data-action="admin-toggle-post" data-id="${x.id}">${x.moderated?'Restore Post':'Hide Post'}</button><h2 style="margin-top:16px">Related reports</h2>${db.reports.filter(r=>r.targetType==='post'&&r.targetId===x.id).map(r=>`<button class="btn full" data-action="admin-report" data-id="${r.id}">${r.id} · ${ESC(r.reason)} · ${ESC(r.status)}</button>`).join('')||'<div class="empty">No related reports.</div>'}`}

const oldScroll=$('screen').scrollTop;$('topbar').innerHTML=header();$('screen').innerHTML=(pages[state.page]||(()=>'<div class="empty">Page not found.</div>'))();$('nav').innerHTML=mainTabs().map(([id,icon,name])=>`<button data-tab="${id}" ${state.page===id?'class="active" aria-current="page"':''}><span class="ico">${icon}</span><span>${name}</span></button>`).join('');$('nav').style.display=(['login','register','forgot','locked'].includes(state.page)||(role==='user'&&who()?.state!=='active'))?'none':'flex';$('screen').scrollTop=resetScroll?0:oldScroll;renderModal();}
function confirmModal(title,detail,kind,id,opts={}){state.modal={title,detail,kind,id,...opts};renderModal()}
function renderModal(){const m=state.modal;if(!m){$('modalhost').classList.remove('open');$('modalhost').innerHTML='';return}$('modalhost').classList.add('open');const modbox=m.reason?`<div class="field"><label>Written reason (required)</label><textarea id="mod-reason" placeholder="Explain the administrative decision..."></textarea></div>`:'';const suspend=m.kind==='suspend'?`<div class="field"><label>Suspension type</label><select id="mod-type"><option value="temporary">Temporary</option><option value="indefinite">Indefinite</option></select></div><div class="field"><label>Duration (days; temporary only)</label><select id="mod-days">${[1,3,7,14,30].map(n=>`<option value="${n}" ${n===7?'selected':''}>${n} days</option>`).join('')}</select></div>`:'';$('modalhost').innerHTML=`<div class="scrim"><section class="sheet" role="dialog" aria-modal="true"><h1>${ESC(m.title)}</h1><p class="muted">${ESC(m.detail)}</p>${suspend}${modbox}<div class="actions"><button class="btn primary" data-action="confirm-modal">${ESC(m.confirm||'Confirm')}</button><button class="btn" data-action="cancel-modal">Cancel</button></div></section></div>`}
function completeModal(){const m=state.modal;if(!m)return;const reason=$('mod-reason')?.value.trim()||'';if(m.reason&&!reason){toast('A written reason is required.');return}const target=m.id;
if(m.kind==='warn'){const x=u(target);notify(x.id,'Account warning',reason);audit('Warning issued',`${x.name}: ${reason}`)}
else if(m.kind==='suspend'){const x=u(target),type=$('mod-type')?.value||'temporary',days=Number($('mod-days')?.value||7);x.state='suspended';x.suspensionType=type;x.suspendedUntil=type==='temporary'?new Date(Date.now()+days*86400000).toISOString():null;notify(x.id,'Account suspended',`${type==='temporary'?`Temporary (${days} days)`:'Indefinite'} suspension: ${reason}`);audit('User suspended',`${x.name} · ${type} · ${reason}`)}
else if(m.kind==='lift'){const x=u(target);x.state='active';x.suspensionType=null;x.suspendedUntil=null;notify(x.id,'Suspension lifted','Your account may be used again.');audit('Suspension lifted',`${x.name}: ${reason}`)}
else if(m.kind==='toggle-post'){const x=p(target);x.moderated=!x.moderated;notify(x.author,x.moderated?'Post hidden':'Post restored',`${x.title}: ${reason}`);audit(x.moderated?'Post hidden':'Post restored',`${x.id} (${x.title}): ${reason}`)}
else if(m.kind==='report-status'){const r=db.reports.find(x=>x.id===target);r.status=m.value;r.decision=reason;notify(r.by,`Report ${m.value.toLowerCase()}`,`Report ${r.id} was ${m.value.toLowerCase()}.`);audit('Report '+m.value,`${r.id}: ${reason}`)}
else if(m.kind==='appeal-decide'){const a=db.appeals.find(x=>x.id===target);a.status=m.value;a.decision=reason;if(m.value==='Approved'){if(a.targetType==='post'&&p(a.targetId))p(a.targetId).moderated=false;if(a.targetType==='account'&&u(a.targetId)){const x=u(a.targetId);if(x.state==='suspended'){x.state='active';x.suspensionType=null;x.suspendedUntil=null}}}notify(a.by,'Appeal '+m.value.toLowerCase(),`${a.id}: ${reason}`);audit('Appeal '+m.value,`${a.id}: ${reason}`)}
else if(m.kind==='deactivate'){const x=who();x.state='deactivated';audit('Self-deactivation',`${x.name} deactivated their account`)}
else if(m.kind==='delete'){const x=who();x.state='deleted';x.map=false;db.posts=db.posts.filter(v=>v.author!=='demo');db.savedPosts=[];db.savedUsers=[];db.reports=db.reports.filter(v=>v.by!=='demo');db.appeals=db.appeals.filter(v=>v.by!=='demo');db.notifications=db.notifications.filter(v=>v.to!=='demo');audit('Demo account deletion',`Fictional user data reset; no real account deleted`)}
else if(m.kind==='reset'){db=seed()}
state.modal=null;persist();if(m.kind==='reset'){setRole('public');toast('Sample data reset.');return}if(m.kind==='delete'){setRole('public');toast('Demo account deleted locally. Reset demo data to restore it.');return}if(m.kind==='deactivate'){state.page='locked';state.stack=[]}render(true);toast('Sample action completed.')}
function handleAction(action,el){const id=el.dataset.id,kind=el.dataset.kind;
switch(action){
case 'back':back();break;

case 'fill-user':state.cred={email:'user@linisgo.demo',password:'User123!'};render();break;

case 'category-home':state.category=id;tab('feed');break;

case 'toggle-filters':state.filterOpen=!state.filterOpen;render();break;
case 'clear-filters':state.search='';state.postType='all';state.userTag='all';state.category='all';state.sort='newest';render();break;
case 'cancel-create':state.editing=null;state.form={type:'request',title:'',desc:'',category:'General',amount:'',photo:''};tab('profile');break;
case 'save-draft':
case 'publish':{const f=state.form;if(!f.title.trim()||!f.desc.trim()){toast('Title and description are required.');break}let x;if(state.editing){x=p(state.editing);Object.assign(x,{type:f.type,title:f.title.trim(),desc:f.desc.trim(),category:f.category,amount:Number(f.amount)||null,photo:f.photo});if(action==='publish'&&x.status==='draft')x.status=f.type==='request'?'open':'active';audit('Post edited',`${x.title}`)}else{x={id:newId('p'),author:'demo',type:f.type,title:f.title.trim(),desc:f.desc.trim(),category:f.category,amount:Number(f.amount)||null,status:action==='save-draft'?'draft':f.type==='request'?'open':'active',moderated:false,created:new Date().toISOString().slice(0,10),photo:f.photo};db.posts.unshift(x);audit(action==='save-draft'?'Draft created':'Post published',x.title)}persist();state.editing=null;state.form={type:'request',title:'',desc:'',category:'General',amount:'',photo:''};tab('my-posts');toast(action==='save-draft'?'Draft saved in demo.':'Post saved and shared with Public and Admin screens.');break}
case 'edit-post':{const x=p(id);if(x?.author!=='demo')break;state.editing=id;state.form={type:x.type,title:x.title,desc:x.desc,category:x.category,amount:x.amount||'',photo:x.photo||''};tab('create');break}
case 'change-post-status':{const x=p(id);if(!x||x.author!=='demo')break;const old=x.status;x.status=old==='archived'?(x.type==='request'?'open':'active'):old==='open'?'closed':old==='closed'?'open':old==='draft'?(x.type==='request'?'open':'active'):'archived';audit('Post status updated',`${x.title}: ${old} → ${x.status}`);persist();render();toast('Post status updated.');break}
case 'archive-post':{const x=p(id);if(x?.author!=='demo')break;x.status='archived';audit('Post archived',x.title);persist();render();toast('Post archived.');break}
case 'save-user':if(role!=='user')break;db.savedUsers=db.savedUsers.includes(id)?db.savedUsers.filter(x=>x!==id):[...db.savedUsers,id];persist();render();toast('Saved users updated.');break;

case 'submit-report':{const f=state.report;if(!f.detail.trim()){toast('Please explain the report.');break}const rid='R'+String(100+db.counter++);db.reports.unshift({id:rid,by:'demo',targetType:f.targetType,targetId:f.targetId,reason:f.reason,detail:f.detail.trim(),status:'Pending',decision:'',created:when()});notify('admin','New report submitted',rid+': '+f.reason);persist();tab('my-reports');toast('Report submitted for admin review.');break}
case 'appeal-post':state.appeal={targetType:'post',targetId:id,detail:''};open('appeal-form');break;

case 'submit-appeal':{const f=state.appeal;if(!f.detail.trim()){toast('Please explain your appeal.');break}if(db.appeals.some(a=>a.by==='demo'&&a.targetType===f.targetType&&a.targetId===f.targetId&&a.status==='Pending')){toast('An appeal for this action is already pending.');break}const aid='A'+String(100+db.counter++);db.appeals.unshift({id:aid,by:'demo',targetType:f.targetType,targetId:f.targetId,detail:f.detail.trim(),status:'Pending',created:when(),decision:''});notify('admin','New moderation appeal',`${aid}: Review requested.`);persist();tab('my-appeals');toast('Appeal submitted for admin review.');break}

function handleClick(event){const m=event.target.closest('[data-tab],[data-nav],[data-action],[data-set],[data-form-type]');if(!m)return;const d=m.dataset;if(d.tab){if(role==='public'&&!['home','feed','map','search'].includes(d.tab))return;tab(d.tab)}else if(d.nav){if(d.nav==='edit-profile')state.profileDraft={};open(d.nav)}else if(d.action)handleAction(d.action,m);else if(d.formType){state.form.type=d.formType;render()}else if(d.set){state[d.set]=d.value;render()}}
['topbar','nav','screen','modalhost'].forEach(id=>$(id).addEventListener('click',handleClick));$('reset-top').addEventListener('click',()=>confirmModal('Reset Demo Data?','Reset all fictional data and return to Public Home.','reset','all',{confirm:'Reset'}));
$('screen').addEventListener('input',e=>{const el=e.target,d=el.dataset;if(d.input==='search'){state.search=el.value;const pos=el.selectionStart,scroll=$('screen').scrollTop;render();$('screen').scrollTop=scroll;const target=$('searchbar');if(target){target.focus();try{target.setSelectionRange(pos,pos)}catch{}}}else if(d.input==='email')state.cred.email=el.value;else if(d.input==='password')state.cred.password=el.value;else if(d.form)state.form[d.form]=el.value;else if(d.report)state.report[d.report]=el.value;else if(d.appeal)state.appeal[d.appeal]=el.value;else if(d.profile){if(!state.profileDraft)state.profileDraft={};state.profileDraft[d.profile]=el.value}});
$('screen').addEventListener('change',e=>{const el=e.target,d=el.dataset;if(d.form)state.form[d.form]=el.value;else if(d.report)state.report[d.report]=el.value;else if(d.setting){who()[d.setting]=el.checked;persist();toast('Privacy preference saved.')}else if(d.profile){if(!state.profileDraft)state.profileDraft={};state.profileDraft[d.profile]=d.profile==='available'?el.value==='true':el.value}else if(d.set){state[d.set]=el.value;render()}else if(el.id==='photo-input'){state.form.photo=el.files?.[0]?.name||'';render();toast('Demo photo filename selected. No upload performed.')}});
$('screen').addEventListener('click',e=>{const el=e.target.closest('[data-map-edit]');if(!el||e.target.closest('button'))return;const rect=el.getBoundingClientRect();const me=who();me.x=Math.round(Math.max(8,Math.min(92,100*(e.clientX-rect.left)/rect.width)));me.y=Math.round(Math.max(8,Math.min(92,100*(e.clientY-rect.top)/rect.height)));persist();render();toast('Approximate demo pin moved. No real GPS used.')});
persist();render(true);
})();
</script>
</body>
